name: Django CI

on:
  push:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - "README.md"
      - ".gitignore"
      - "scripts/**"
      - ".env.example"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "**.py"
      - "requirements.txt"
      - ".env.example"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: techfest-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DJANGO_SECRET_KEY: ci-only-placeholder-key-not-for-deployment
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Scan current source for hard-coded credentials
        run: python scripts/check_secrets.py

      - name: Compile Python files
        run: python -m compileall -q aboutus contactus general register techfest manage.py scripts/check_secrets.py

      - name: Check Django configuration
        run: python manage.py check

      - name: Run Django tests
        run: python manage.py test
